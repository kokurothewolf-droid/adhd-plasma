# Hyprland configuration - ADHD Plasma adapted
# Minimal config - no keybindings (user manages their own)

# Basic Hyprland settings
set $default_terminal foot
set $browser firefox
set $editor nvim

# Monitor setup
monitor = _, none, none

# Appearance
fonts = JetBrainsMono Nerd Font:size=10
layout = bsp

# No custom keybindings - user manages their own
# (existing Omarchy bindings take precedence)

# ADHD Plasma bar/config would be loaded separately
